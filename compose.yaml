services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: retail_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RETAIL_DB_PASSWORD:?Set RETAIL_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - retail_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "retail_project"]
      interval: 2s
      timeout: 3s
      retries: 30

  etl:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: retail_project
      PGUSER: postgres
      PGPASSWORD: ${RETAIL_DB_PASSWORD:?Set RETAIL_DB_PASSWORD in .env}
    volumes:
      - ./data:/app/data
    profiles: ["etl"]

volumes:
  retail_data:
